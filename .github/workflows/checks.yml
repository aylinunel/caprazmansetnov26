name: Pipeline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Offline pipeline tests (no network, no database)
        working-directory: pipeline
        run: python -m unittest discover -s tests -v

  biasguard-validity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            biasguard/requirements.txt
            tools/mesa/requirements.txt
      - run: python -m pip install -r biasguard/requirements.txt -r tools/mesa/requirements.txt
      - name: Offline detector, observability, provenance and evaluator tests
        run: python -m unittest discover -s biasguard -t . -p 'test_*.py' -v
      - name: All 138 synthetic executable contracts (not detector accuracy)
        run: python -m biasguard.simulation validate --output "$RUNNER_TEMP/mesa-coverage.json"
